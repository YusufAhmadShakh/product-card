<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточки товаров</title>
  <link rel="stylesheet" href="/styles/main-style.css">
  <link rel="stylesheet" href="/styles/products.css">
</head>

<body>
  
	<h1 class="main-title">Выберите свой продукт</h1>
  <div class="buttons-bar">
    <button id="button-change-cards-color" class="buttons">Сменить цвет первой карточки</button>
    <button id="button-change-all-cards-color" class="buttons">Сменить цвет всех карточек</button>
    <button id="button-open-google" class="buttons">Перейти в Google</button>
    <button id="button-output-console-log" class="buttons">Вывести сообщение в консоль</button>
    <button id="button-just" class="buttons">Просто кнопка</button>
  </div>

  <ul id="products-list"></ul>
  <template id="products-template">
    <li class="products-container">
      <div class="products__image">
      <img src="" alt=""/></div>
      <p class="products__skin-type"></p>
      <p class="products__name"></p>
      <p class="products__description"></p>
      <p class="products__compound"></p>
      <p class="products__price"></p>
    </li>
  </template>

  <script src="main.js" defer></script>
  <script src="homework-7.js"></script>
  <script src="homework-8.js"></script>
  <script type="module" src="homework-9.js"></script>
  <script type="module" src="homework-10.js"></script>
  <script type="module" src="product-cards.js"></script>
  <script type="module" src="comments.js"></script>
</body>
</html>
